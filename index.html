<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer type='module' src="/scripts/index.mjs"></script>
    <link rel="stylesheet" href="./styles/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
        }
    </style>

<body>
    <div class='container'>
        <h1>Weather Forcast</h1>
    </div>
    <form class='userInput' id='userInput'>
        <input id='loc_input' type="text" name="location" placeholder='Enter your location' id="location-input">
        <button class='btn' id='submit' type='submit' aria-label='Search'>

            Search
        </button>
    </form>
    <div class='weather-results container wrap hidden' id="weather-results">
        <!-- left column of current -->
        <div id='grid' class="container-fluid">
            <div id='current' class="row">

                <div class="col-md-4 col-sm-5">
                    <h5>
                        <span id="location"></span>
                    </h5>
                    <h5>
                        <span id="dTime"></span>
                    </h5>


                </div>
                <div id='temperature' class="col-md-5 col-sm-7" style="margin: 10px auto;padding:0;">
                    <div class="d-flex align-items-center column justify-content-center">

                        <p id="temperatureText" class="mainTemperature">0</p>
                        <p style="font-size: 3.5rem;"><a id="farenheit">°F</a></p>

                    </div>
                </div>

                <div class="col-xs-12 col-sm-12 col-md-3 row" style="text-align: right;font-size: 1.5rem;">
                    <div id='realFeel'>
                        <p id="realFeelText">0</p>
                    </div>
                    <div id='precipitation'>
                        <p id="precipitationText">0</p>
                    </div>
                    <div id='windSpeed'>
                        <p id="windSpeedText">0</p>
                    </div>
                </div>
            </div>
            <div id='daily' class="container-fluid">
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
