<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="/scripts/index.js"></script>
    <link rel="stylesheet" href="./styles/style.css">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>
    <div class='container'>
        <h1>Weather Forcast</h1>
    </div>
    <form class='userInput' id='userInput'>
        <input id='loc_input' type="text" name="location" placeholder='Enter your location' id="location-input">
        <button class='btn' id='submit' type='submit' aria-label='Search'>

            Search
        </button>
    </form>
    <div class='weather-results wrap' id="weather-results">
        <h2>
            Weather in <span id="location">Location Name</span>
        </h2>
         <h2>
            At time <span id="dTime">time</span>
        </h2>
        <div id='grid'>
            <div id='current'>
                <div id='temperature'>temperature
                    <p id="temperatureText">0</p>
                </div>
                <div id='realFeel'>realFeel
                    <p id="realFeelText">0</p>
                </div>
                <div id='precipitation'>precipitation
                    <p id="precipitationText">0</p>
                </div>
                <div id='windSpeed'>windSpeed
                    <p id="windSpeedText">0</p>
                </div>
            </div>
            <div id = 'daily' class = "container-fluid">
            </div>

        </div>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>

</html>
